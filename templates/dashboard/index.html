{% extends "base.html" %}

{% block title %}Tableau de Bord Admin - Academiscan{% endblock %}

{% block head %}
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h1 class="h2"><i class="bi bi-speedometer2 me-2"></i>Tableau de Bord Administrateur</h1>
    <div class="btn-group">
        <a href="{{ url_for('questionnaire.liste') }}" class="btn btn-outline-primary"><i class="bi bi-card-list me-1"></i>Questionnaires</a>
        <a href="{{ url_for('export.index') }}" class="btn btn-outline-primary"><i class="bi bi-download me-1"></i>Exports</a>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <div id="chart-reponse" style="width:100%; height:350px;"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <div id="chart-insertion" style="width:100%; height:350px;"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <div id="chart-evolution" style="width:100%; height:350px;"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <div id="chart-offres" style="width:100%; height:350px;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    var layout_config = {responsive: true, margin: {t: 40, b: 40, l: 40, r: 40}};
    
    var graphReponse = {{ chart_reponse | safe }};
    Plotly.newPlot('chart-reponse', graphReponse.data, graphReponse.layout, layout_config);
    
    var graphInsertion = {{ chart_insertion | safe }};
    Plotly.newPlot('chart-insertion', graphInsertion.data, graphInsertion.layout, layout_config);
    
    var graphEvolution = {{ chart_evolution | safe }};
    Plotly.newPlot('chart-evolution', graphEvolution.data, graphEvolution.layout, layout_config);
    
    var graphOffres = {{ chart_offres | safe }};
    Plotly.newPlot('chart-offres', graphOffres.data, graphOffres.layout, layout_config);
</script>
{% endblock %}
