{% extends "base.html" %}

{% block title %}Tableau de Bord Admin - Academiscan{% endblock %}

{% block head %}
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .chart-container {
            min-height: 380px;
            width: 100%;
        }
    </style>
{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 pb-2 border-bottom">
    <h1 class="h2 mb-3 mb-sm-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Tableau de Bord Administrateur</h1>
    <div class="btn-group shadow-sm">
        <a href="{{ url_for('questionnaire.liste') }}" class="btn btn-outline-primary"><i class="bi bi-card-list me-1"></i>Questionnaires</a>
        <a href="{{ url_for('export.index') }}" class="btn btn-outline-primary"><i class="bi bi-download me-1"></i>Exports</a>
    </div>
</div>

<div class="row g-4 mb-5">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100 card-hover">
            <div class="card-body p-2 p-md-3">
                <div id="chart-reponse" class="chart-container"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100 card-hover">
            <div class="card-body p-2 p-md-3">
                <div id="chart-insertion" class="chart-container"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100 card-hover">
            <div class="card-body p-2 p-md-3">
                <div id="chart-evolution" class="chart-container"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100 card-hover">
            <div class="card-body p-2 p-md-3">
                <div id="chart-offres" class="chart-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    var layout_config = {responsive: true, displayModeBar: false, margin: {t: 40, b: 40, l: 40, r: 40}};
    
    var graphReponse = {{ chart_reponse | safe }};
    Plotly.newPlot('chart-reponse', graphReponse.data, graphReponse.layout, layout_config);
    
    var graphInsertion = {{ chart_insertion | safe }};
    Plotly.newPlot('chart-insertion', graphInsertion.data, graphInsertion.layout, layout_config);
    
    var graphEvolution = {{ chart_evolution | safe }};
    Plotly.newPlot('chart-evolution', graphEvolution.data, graphEvolution.layout, layout_config);
    
    var graphOffres = {{ chart_offres | safe }};
    Plotly.newPlot('chart-offres', graphOffres.data, graphOffres.layout, layout_config);
</script>
{% endblock %}
