{% extends "base.html" %}

{% block title %}Merci !{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card shadow-sm border-0 py-5">
            <div class="card-body">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h2 class="mt-4">{{ questionnaire.titre }}</h2>
                <p class="lead text-muted mt-3">Merci pour votre participation !</p>
                <p>Vous avez déjà soumis vos réponses pour ce questionnaire.</p>
                
                <div class="mt-4">
                    <a href="{{ url_for('dashboard.public') }}" class="btn btn-primary">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
